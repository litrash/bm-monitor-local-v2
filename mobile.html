<style>
:root {
  --bg: #f0f2f5; --card: #fff; --text: #333; --muted: #888;
  --border: #e8e8e8; --accent: #3498db; --red: #e74c3c; --green: #27ae60;
  --orange: #f39c12;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 18px; }
header .sub { font-size: 12px; color: #a0aec0; margin-top: 2px; }
/* Nav tabs */
.nav { display: flex; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 52px; z-index: 99; -webkit-overflow-scrolling: touch; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn { flex-shrink: 0; padding: 12px 16px; border: none; background: none; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
/* Section */
.section { display: none; padding: 12px; }
.section.active { display: block; }
/* Stats summary */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.summary-card { background: var(--card); border-radius: 8px; padding: 10px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.summary-card .num { font-size: 20px; font-weight: 700; }
.summary-card .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
/* BM card */
.bm-item { background: var(--card); border-radius: 8px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); border-left: 3px solid var(--accent); }
.bm-item.urgent { border-left-color: var(--red); }
.bm-item .bm-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.bm-item .bm-meta { font-size: 12px; color: var(--muted); }
.cd { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 4px; }
.cd.urgent { background: #fadbd8; color: #c0392b; }
.cd.warn { background: #fef9e7; color: #b7950b; }
.cd.ok { background: #d5f5e3; color: #1e8449; }
/* ZJ filters */
.filter-row { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.filter-row::-webkit-scrollbar { display: none; }
.fbtn { flex-shrink: 0; padding: 5px 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); font-size: 12px; white-space: nowrap; color: var(--text); }
.fbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.fbtn.city { padding: 3px 8px; font-size: 11px; border-radius: 10px; }
.fbtn.city.active { background: var(--green); border-color: var(--green); }
.search-box { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; margin-bottom: 10px; outline: none; }
.search-box:focus { border-color: var(--accent); }
/* ZJ item */
.zj-item { background: var(--card); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.zj-item .zj-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.zj-item .zj-title a { color: var(--text); text-decoration: none; }
.zj-item .zj-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.date-recent { color: var(--red) !important; font-weight: 600; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.badge-biannei { background: #d4efdf; color: #1e8449; }
.badge-bianwai { background: #fadbd8; color: #c0392b; }
.badge-xuandiao { background: #d6eaf8; color: #2471a3; }
.badge-unknown { background: #eaecee; color: #7f8c8d; }
.badge-hot { background: #fdedec; color: #e74c3c; }
/* Load more */
.load-more { text-align: center; padding: 12px; }
.load-more button { padding: 8px 24px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); font-size: 13px; color: var(--accent); }
.info-line { font-size: 11px; color: var(--muted); text-align: center; padding: 8px 0; }
.closed-section { margin-top: 12px; }
.closed-section h4 { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.closed-item { font-size: 12px; color: var(--muted); padding: 3px 0; }
footer { text-align: center; padding: 16px; color: var(--muted); font-size: 11px; }

/* ===== 岗位收藏 ===== */
.fav-btn { border: none; background: none; cursor: pointer; font-size: 16px; line-height: 1;
  padding: 3px 4px; border-radius: 6px; color: #c8ccd0; transition: transform 0.15s, color 0.15s; }
.fav-btn:hover { color: #f1c40f; transform: scale(1.15); }
.fav-btn.on { color: #f1c40f; }
.fav-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fav-bar .fav-mode { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--card); cursor: pointer; font-size: 13px; white-space: nowrap; }
.fav-bar .fav-mode.active { background: #f1c40f; border-color: #f1c40f; color: #fff; font-weight: 600; }
.fav-bar .fav-tool { padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--card); cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap; }
.fav-bar .fav-tool:hover { border-color: var(--accent); color: var(--accent); }
.fav-empty { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 14px; }

/* ===== 访问密码门 ===== */
.gate { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.gate.hidden { display: none; }
.gate-box { background: #fff; border-radius: 14px; padding: 32px 28px; width: 300px; max-width: 86vw; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
.gate-box h2 { font-size: 18px; color: #2c3e50; margin-bottom: 6px; }
.gate-box p { font-size: 13px; color: #7f8c8d; margin-bottom: 18px; }
.gate-box input { width: 100%; padding: 11px 14px; border: 1px solid #e0e4e8; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 12px; }
.gate-box input:focus { border-color: #3498db; }
.gate-box button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #3498db; color: #fff; font-size: 15px; cursor: pointer; }
.gate-box button:active { background: #2980b9; }
.gate-err { color: #e74c3c; font-size: 12px; height: 15px; margin-top: 8px; }

</style>
</head>

<script>
/* 先读出收藏存档：FAV_JS 在页面末尾才执行，主脚本初始化时要用它渲染星标 */

<script>
(function() {
  var BM = JSON.parse(document.getElementById('bm-data').textContent);
  var ZJ_DATA = JSON.parse(document.getElementById('zj-data').textContent);
  var ZJ_STATS = JSON.parse(document.getElementById('zj-stats').textContent);
  var REGIONS = JSON.parse(document.getElementById('regions-config').textContent);

  var PAGE_SIZE = 20;
  var FAV_BAR = '<button type="button" class="fav-mode" data-fav-mode>⭐ 收藏</button><button type="button" class="fav-tool fav-all" data-fav-all>回到全部</button><button class="fav-tool" data-fav-export>导出</button><button class="fav-tool" data-fav-import>导入</button><button class="fav-tool" data-fav-clear>清空</button>';
  var favFilter = false;

  // 收藏按钮的 active 由 window.__FAV_MODE 决定，而不是写在静态 HTML 里
  function favBarHtml() {
    return FAV_BAR.replace('class="fav-mode"', 'class="fav-mode' + (window.__FAV_MODE ? ' active' : '') + '"');
  }
  var zjState = {};
  REGIONS.forEach(function(r) {
    zjState[r.key] = {bz:null, city:null, search:'', page:1};
  });

  // Build nav + sections
  var navBar = document.getElementById('navBar');
  var sectionsEl = document.getElementById('sections');
  var tabs = [{id:'bm', label:'🏫 考生之家'}];
  REGIONS.forEach(function(r) { tabs.push({id:'zj-'+r.key, label:'🎓 '+r.label}); });

  tabs.forEach(function(t, i) {
    var btn = document.createElement('button');
    btn.className = 'nav-btn' + (i===0?' active':'');
    btn.textContent = t.label;
    btn.onclick = function() { switchTab(t.id); };
    navBar.appendChild(btn);

    var sec = document.createElement('div');
    sec.className = 'section' + (i===0?' active':'');
    sec.id = 'sec-' + t.id;
    sectionsEl.appendChild(sec);
  });

  renderBm();
  REGIONS.forEach(function(r) { renderZj(r.key); });

  function switchTab(id) {
    document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
    var idx = tabs.findIndex(function(t){return t.id===id;});
    navBar.children[idx].classList.add('active');
    document.getElementById('sec-'+id).classList.add('active');
  }

  // BM
  function renderBm() {
    var el = document.getElementById('sec-bm');
    var active = BM.active || [];
    var closed = BM.closed || [];
    var h = '<div class="summary">';
    h += '<div class="summary-card"><div class="num" style="color:var(--accent)">'+active.length+'</div><div class="lbl">进行中</div></div>';
    h += '<div class="summary-card"><div class="num" style="color:var(--red)">'+closed.length+'</div><div class="lbl">已结束</div></div>';
    h += '<div class="summary-card"><div class="num" style="color:var(--green)">'+(active.length+closed.length)+'</div><div class="lbl">总计</div></div>';
    h += '</div>';
    if (active.length === 0) {
      h += '<div class="info-line">暂无进行中的报名项目</div>';
    }
    active.forEach(function(e) {
      var isUrgent = e.phase==='ongoing' && e.remaining!==null && e.remaining<=120;
      var cd = '';
      if (e.remaining !== null) {
        var cls, txt;
        if (e.remaining<60) { txt=e.remaining+'分钟'; cls='urgent'; }
        else if (e.remaining<1440) { txt=Math.floor(e.remaining/60)+'小时'; cls='warn'; }
        else { txt=Math.floor(e.remaining/1440)+'天'; cls='ok'; }
        cd = '<span class="cd '+cls+'">⏳'+txt+'</span>';
      }
      h += '<div class="bm-item'+(isUrgent?' urgent':'')+'">';
      h += '<div class="bm-title">【'+(e.area||'')+'】'+e.name+cd+'</div>';
      h += '<div class="bm-meta">📅 '+(e.start||'?')+' ~ '+(e.end||'?');
      if (e.pay_start) h += ' | 💰 '+e.pay_start+' ~ '+e.pay_end;
      h += ' | '+(e.phase==='upcoming'?'⏳即将开始':'🔴报名中');
      h += '</div></div>';
    });
    if (closed.length > 0) {
      h += '<div class="closed-section"><h4>📁 近期已结束 ('+closed.length+')</h4>';
      closed.forEach(function(c) { h += '<div class="closed-item">· '+c.name+'</div>'; });
      h += '</div>';
    }
    el.innerHTML = h;
  }

  // ZJ
  function renderZj(key) {
    var region = REGIONS.find(function(r){return r.key===key;});
    var el = document.getElementById('sec-zj-'+key);
    var stats = ZJ_STATS[key];
    var data = ZJ_DATA[key] || [];
    var st = zjState[key];
    var color = region.color;

    // Summary
    var h = '<div class="summary">';
    h += '<div class="summary-card"><div class="num" style="color:'+color+'">'+stats.total+'</div><div class="lbl">招聘总数</div></div>';
    h += '<div class="summary-card"><div class="num" style="color:#27ae60">'+stats.bianzhi['编制']+'</div><div class="lbl">编制</div></div>';
    h += '<div class="summary-card"><div class="num" style="color:#e74c3c">'+(stats.bianzhi['编外']+stats.bianzhi['选调'])+'</div><div class="lbl">编外/选调</div></div>';
    h += '</div>';

    // Search
    h += '<input class="search-box" type="text" placeholder="🔍 搜索标题..." oninput="window._mZjSearch(\''+key+'\',this.value)">';

    // 收藏筛选 / 导入导出（active 状态按全局标志渲染，整段 innerHTML 重建也不会丢）
    h += '<div class="filter-row"><div class="fav-bar">' + favBarHtml() + '</div></div>';

    // BZ filter
    h += '<div class="filter-row">';
    ['全部','编制','编外','选调','未知'].forEach(function(t) {
      var act = (t==='全部' && !st.bz) || st.bz===t;
      h += '<button class="fbtn'+(act?' active':'')+'" onclick="window._mZjBz(\''+key+'\',\''+t+'\')">'+t+'</button>';
    });
    h += '</div>';

    // City filter
    var cities = Object.keys(stats.cities);
    h += '<div class="filter-row">';
    h += '<button class="fbtn city'+(!st.city?' active':'')+'" onclick="window._mZjCity(\''+key+'\',null)">全部</button>';
    cities.forEach(function(c) {
      h += '<button class="fbtn city'+(st.city===c?' active':'')+'" onclick="window._mZjCity(\''+key+'\',\''+c+'\')">'+c+'('+stats.cities[c]+')</button>';
    });
    h += '</div>';

    // Filter data
    var filtered = data;
    if (st.bz) filtered = filtered.filter(function(e){return e.bianzhi===st.bz;});
    if (st.city) filtered = filtered.filter(function(e){return e.city===st.city;});
    if (st.search) {
      var q = st.search.toLowerCase();
      filtered = filtered.filter(function(e){return (e.title||'').toLowerCase().indexOf(q)>=0 || (e.city||'').toLowerCase().indexOf(q)>=0;});
    }
    if (favFilter && window.FavStore) filtered = filtered.filter(function(e){ return window.FavStore.isFav(e); });

    var show = filtered.slice(0, st.page * PAGE_SIZE);
    var badgeCls = {'编制':'badge-biannei','编外':'badge-bianwai','选调':'badge-xuandiao','未知':'badge-unknown'};

    h += '<div class="info-line">共 '+filtered.length+' 条'+(favFilter?'（仅收藏 '+(window.FavStore?window.FavStore.count():0)+'）':'')+'</div>';

    // 判断近两日
    var today = new Date(); today.setHours(0,0,0,0);
    var twoDaysAgo = new Date(today); twoDaysAgo.setDate(twoDaysAgo.getDate()-2);
    function isRecent(d) {
      if (!d || d==='热门推荐') return false;
      var parts = d.split('-');
      if (parts.length<3) return false;
      var dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      return dt >= twoDaysAgo && dt <= today;
    }

    show.forEach(function(e) {
      var bz = e.bianzhi||'未知';
      var isHot = e.date==='热门推荐';
      var recent = isRecent(e.date);
      h += '<div class="zj-item">';
      h += '<div class="zj-title">'+favStar(e)+'<a href="'+(e.url||'#')+'" target="_blank">'+e.title+'</a></div>';
      h += '<div class="zj-meta">';
      h += '<span class="badge '+(badgeCls[bz]||'badge-unknown')+'">'+bz+'</span>';
      h += '<span>'+(e.city||'?')+'</span>';
      if (e.count) h += '<span>'+e.count+'人</span>';
      h += '<span class="'+(recent?'date-recent':'')+'">' +(isHot?'<span class="badge badge-hot">热门</span>':e.date)+'</span>';
      h += '</div></div>';
    });

    if (show.length < filtered.length) {
      h += '<div class="load-more"><button onclick="window._mZjMore(\''+key+'\')">加载更多（还有 '+(filtered.length-show.length)+' 条）</button></div>';
    }

    el.innerHTML = h;
  }

  window._mZjSearch = function(key, val) { zjState[key].search=val; zjState[key].page=1; renderZj(key); };
  window._mZjBz = function(key, val) { zjState[key].bz = val==='全部'?null:val; zjState[key].page=1; renderZj(key); };
  window._mZjCity = function(key, val) { zjState[key].city=val; zjState[key].page=1; renderZj(key); };
  window._mZjMore = function(key) { zjState[key].page++; renderZj(key); };

  function isFavInit(e) {
    if (window.FavStore) return window.FavStore.isFav(e);
    var init = window.__FAV_INIT || {};
    return !!(init[e.url || ('t:' + (e.title || ''))]);
  }
  function favStar(e) {
    var on = isFavInit(e);
    return '<button class="fav-btn'+(on?' on':'')+'" data-fav-url="'+esc(e.url||'')+'" data-fav-title="'+esc(e.title||'')+'" title="收藏">'+(on?'★':'☆')+'</button> ';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.addEventListener('favmode', function(ev) {
    favFilter = ev.detail.on;
    REGIONS.forEach(function(r) { zjState[r.key].page = 1; renderZj(r.key); });
  });
  document.addEventListener('favchange', function() {
    REGIONS.forEach(function(r) { renderZj(r.key); });
  });

  // 工具栏状态同步：不管哪段脚本什么时候派发 favchange，
  // 都让收藏按钮的 active 与全局标志保持一致
  document.addEventListener('favchange', function() {
    if (window.FavRefreshStars) window.FavRefreshStars();
  });
  document.addEventListener('favmode', function() {
    if (window.FavRefreshStars) window.FavRefreshStars();
  });
})();
</script>
<script>
/* ===== 岗位收藏（localStorage） ===== */
(function() {
  var FAV_KEY = 'zj_fav_v1';
  var favSet = {};

  try { favSet = JSON.parse(localStorage.getItem(FAV_KEY) || '{}') || {}; }
  catch (e) { favSet = {}; }

  function save() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favSet)); } catch (e) {}
  }

  // 收藏 id：没有 url 时退回标题
  function favId(e) { return e.url || ('t:' + (e.title || '')); }

  function isFav(e) { return !!favSet[favId(e)]; }

  function setFav(e, on) {
    var id = favId(e);
    if (on) { favSet[id] = 1; } else { delete favSet[id]; }
    save();
  }

  /// 收藏存档（页面主脚本先读它做初始化，主脚本在 FAV_JS 之前执行）
  window.__FAV_INIT = favSet;

  window.FavStore = {
    KEY: FAV_KEY,
    isFav: isFav,
    toggle: function(e) { var on = !isFav(e); setFav(e, on); return on; },
    count: function() { return Object.keys(favSet).length; },
    clear: function() { favSet = {}; save(); },
    export: function() {
      var blob = new Blob([JSON.stringify(favSet, null, 2)], {type: 'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zhaopin-favorites.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
    },
    import: function() {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function() {
        var f = inp.files && inp.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function() {
          try {
            var obj = JSON.parse(r.result);
            if (obj && typeof obj === 'object') {
              Object.keys(obj).forEach(function(k) { favSet[k] = 1; });
              save();
              document.dispatchEvent(new CustomEvent('favchange'));
            }
          } catch (e) { alert('文件格式不对，需要导出的 json'); }
        };
        r.readAsText(f);
      };
      inp.click();
    },
    clearAll: function() {
      if (confirm('清空所有收藏？')) {
        favSet = {}; save();
        document.dispatchEvent(new CustomEvent('favchange'));
      }
    }
  };

  // 点击收藏星标（事件委托，re-render 后依然有效）
  document.addEventListener('click', function(ev) {
    var star = ev.target.closest ? ev.target.closest('[data-fav-url]') : null;
    if (!star) return;
    ev.preventDefault();
    ev.stopPropagation();
    var on = window.FavStore.toggle({url: star.getAttribute('data-fav-url') || '', title: star.getAttribute('data-fav-title') || ''});
    star.classList.toggle('on', on);
    star.textContent = on ? '★' : '☆';
    document.dispatchEvent(new CustomEvent('favchange'));
  });

  // 收藏筛选 / 导出 / 导入 / 清空
  document.addEventListener('click', function(ev) {
    var t = ev.target;
    if (!t.closest) return;
    if (t.closest('[data-fav-export]')) { window.FavStore.export(); return; }
    if (t.closest('[data-fav-import]')) { window.FavStore.import(); return; }
    if (t.closest('[data-fav-clear]')) { window.FavStore.clearAll(); return; }

    // 回到全部：显式退出收藏模式，不依赖当前按钮的 active 状态
    if (t.closest('[data-fav-all]')) {
      document.querySelectorAll('[data-fav-mode]').forEach(function(b) { b.classList.remove('active'); });
      document.dispatchEvent(new CustomEvent('favmode', {detail: {on: false}}));
      return;
    }

    var mode = t.closest('[data-fav-mode]');
    if (mode) {
      // 正在收藏模式 -> 退出；否则进入。用全局标志判断，不依赖按钮 class
      var on = !window.__FAV_MODE;
      window.__FAV_MODE = on;
      document.querySelectorAll('[data-fav-mode]').forEach(function(b) { b.classList.toggle('active', on); });
      document.dispatchEvent(new CustomEvent('favmode', {detail: {on: on}}));
    }
  });

  // 初始化页面里已有的星标状态（静态 DOM 的情形）
  window.FavRefreshStars = function() {
    document.querySelectorAll('[data-fav-url]').forEach(function(s) {
      var on = !!favSet[s.getAttribute('data-fav-url')];
      s.classList.toggle('on', on);
      s.textContent = on ? '★' : '☆';
    });
    // 收藏按钮的 active 状态由全局标志决定，避免重渲染后状态丢失
    document.querySelectorAll('[data-fav-mode]').forEach(function(b) {
      b.classList.toggle('active', !!window.__FAV_MODE);
    });
  };
  window.FavRefreshStars();

  // 主脚本早于本脚本执行，初始化时拿不到 FavStore；
  // 这里再派发一次 favchange，让页面把星标状态补上。
  document.dispatchEvent(new CustomEvent('favchange'));
})();
</script>
<script>
(function() {
  var HASH = 'c281a4206957fb79643be1023c92aaa0d7ae5c014538e9ec0f2060e82260e339';
  var B64 = 'eGlhb2h1YWppYQ==';
  var KEY = 'zj_auth_v1';
  var gate = document.getElementById('gate');
  var input = document.getElementById('gateInput');
  var err = document.getElementById('gateErr');

  function unlock() { gate.classList.add('hidden'); }

  function fallbackOk(v) {
    // crypto.subtle 不可用时的回退校验（仅支持 ASCII 密码）
    try { return btoa(v) === B64; } catch (e) { return false; }
  }

  function check() {
    var v = input.value;
    if (!v) { err.textContent = '请输入密码'; return; }
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(buf) {
        var hex = Array.prototype.map.call(new Uint8Array(buf), function(b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
        if (hex === HASH) {
          try { localStorage.setItem(KEY, '1'); } catch (e) {}
          unlock();
        } else {
          err.textContent = '密码错误';
          input.value = '';
        }
      }).catch(function() {
        if (fallbackOk(v)) { try { localStorage.setItem(KEY, '1'); } catch (e) {} unlock(); }
        else { err.textContent = '密码错误'; input.value = ''; }
      });
    } else if (fallbackOk(v)) {
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
      unlock();
    } else {
      err.textContent = '密码错误';
      input.value = '';
    }
  }

  document.getElementById('gateBtn').onclick = check;
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });

  var authed = false;
  try { authed = localStorage.getItem(KEY) === '1'; } catch (e) {}
  if (authed) unlock(); else input.focus();
})();
</script>
